name: Foundry datasets

on:
  pull_request:
    paths:
      - 'evaluations/**'
      - 'scripts/foundry_datasets.py'
      - 'scripts/business_evaluation_datasets.py'
      - 'scripts/business_evaluation_data.py'
      - 'scripts/business_evaluation_runtime.py'
      - 'scripts/evaluate_business.py'
      - 'scripts/manual_agent_test.py'
      - 'scripts/evaluate_agent.py'
      - 'scripts/requirements.txt'
      - 'tests/test_foundry_datasets.py'
      - 'tests/test_business_dataset.py'
      - 'tests/test_evaluate_agent.py'
      - 'tests/test_evaluate_business.py'
      - 'tests/test_manual_agent_test.py'
      - '.github/workflows/foundry-datasets.yml'
  push:
    branches: [main]
    paths:
      - 'evaluations/**'
      - 'scripts/foundry_datasets.py'
      - 'scripts/business_evaluation_datasets.py'
      - 'scripts/business_evaluation_data.py'
      - 'scripts/business_evaluation_runtime.py'
      - 'scripts/evaluate_business.py'
      - 'scripts/manual_agent_test.py'
      - 'scripts/evaluate_agent.py'
      - 'scripts/requirements.txt'
      - 'tests/test_foundry_datasets.py'
      - 'tests/test_business_dataset.py'
      - 'tests/test_evaluate_agent.py'
      - 'tests/test_evaluate_business.py'
      - 'tests/test_manual_agent_test.py'
      - '.github/workflows/foundry-datasets.yml'
  workflow_dispatch:
    inputs:
      operation:
        description: Check local exports or publish the single canonical six-case reference.
        required: true
        type: choice
        default: check
        options: [check, publish]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements.txt
      - name: Reject stale committed JSONL and validate sources
        run: |
          python scripts/foundry_datasets.py check
          python -m unittest discover -s tests -p test_foundry_datasets.py -v
          python -m unittest discover -s tests -p test_business_dataset.py -v
          python -m unittest discover -s tests -p test_evaluate_agent.py -v
          python -m unittest discover -s tests -p test_evaluate_business.py -v
          python -m unittest discover -s tests -p test_manual_agent_test.py -v

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'publish' && github.ref == 'refs/heads/main' && github.repository == 'cpinotossi/cptdazagentprojectmanagment'
    needs: validate
    environment: foundry-demo
    concurrency:
      group: foundry-demo-datasets
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      FOUNDRY_PROJECT_ENDPOINT: https://ai-projplan-axowf3.services.ai.azure.com/api/projects/project-planning
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check dedicated Foundry identity configuration
        env:
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          : "${CLIENT_ID:?Configure the Foundry release identity in foundry-demo}"
          test "$TENANT_ID" = f71980b2-590a-4de9-90d5-6fbc867da951
          test "$SUBSCRIPTION_ID" = 98525264-1eb4-493f-983d-16a330caa7f6
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: python -m pip install -r scripts/requirements.txt
      - name: Publish only the canonical six-case reference
        run: python scripts/foundry_datasets.py publish --confirm
      - name: Record published versions
        run: |
          {
            printf '### Foundry datasets\n\nCommit: `%s`\n\n' "$GITHUB_SHA"
            printf '```json\n'
            cat evaluations/releases/datasets.json
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"
