name: Foundry agents

on:
  pull_request:
    paths:
      - 'scripts/foundry_agents.py'
      - 'agents/**'
      - 'scripts/setup_agent.py'
      - 'scripts/setup_baseline_agent.py'
      - 'scripts/update_agent_instructions.py'
      - 'scripts/requirements.txt'
      - 'tests/test_foundry_agents.py'
      - 'tests/test_setup_agent.py'
      - 'tests/test_setup_baseline_agent.py'
      - 'tests/test_agent_routing.py'
      - 'docs/foundry-agents.md'
      - '.github/workflows/foundry-agents.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/foundry_agents.py'
      - 'agents/**'
      - 'scripts/setup_agent.py'
      - 'scripts/setup_baseline_agent.py'
      - 'scripts/update_agent_instructions.py'
      - 'scripts/requirements.txt'
      - 'tests/test_foundry_agents.py'
      - 'tests/test_setup_agent.py'
      - 'tests/test_setup_baseline_agent.py'
      - 'tests/test_agent_routing.py'
      - 'docs/foundry-agents.md'
      - '.github/workflows/foundry-agents.yml'
  workflow_dispatch:
    inputs:
      operation:
        description: Offline check or publish both existing agents (no inference).
        required: true
        type: choice
        default: check
        options: [check, publish]
      baseline_source_version:
        description: Explicit published project-planning-baseline version containing the approved static snapshot.
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements.txt
      - name: Offline agent checks and focused regressions
        run: |
          python scripts/foundry_agents.py check
          python -m unittest discover -s tests -p 'test_foundry_agents.py' -v
          python -m unittest discover -s tests -p 'test_setup_agent.py' -v
          python -m unittest discover -s tests -p 'test_setup_baseline_agent.py' -v
          python -m unittest discover -s tests -p 'test_agent_routing.py' -v

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'publish' && github.ref == 'refs/heads/main' && github.repository == 'cpinotossi/cptdazagentprojectmanagment'
    needs: validate
    environment: foundry-demo
    concurrency:
      group: foundry-demo-agents
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      BASELINE_SOURCE_VERSION: ${{ inputs.baseline_source_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check dedicated Foundry identity and explicit sources
        env:
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          test "$CLIENT_ID" = 0ba22d37-90be-41ea-ab63-0b5ce61004ad
          test "$TENANT_ID" = f71980b2-590a-4de9-90d5-6fbc867da951
          test "$SUBSCRIPTION_ID" = 98525264-1eb4-493f-983d-16a330caa7f6
          [[ "$BASELINE_SOURCE_VERSION" =~ ^[1-9][0-9]*$ ]]
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: python -m pip install -r scripts/requirements.txt
      - name: Publish immutable versions and verify exact readback
        run: |
          python scripts/foundry_agents.py publish --confirm \
            --baseline-source-version "$BASELINE_SOURCE_VERSION"
      - name: Record versions without exposing snapshot data
        if: always()
        run: |
          if test -f evaluations/releases/agents.json; then
            {
              printf '### Foundry agents\n\nCommit: `%s`\n\n' "$GITHUB_SHA"
              printf '```json\n'
              cat evaluations/releases/agents.json
              printf '\n```\n'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
