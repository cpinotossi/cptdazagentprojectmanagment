name: Infrastructure CI

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'infra/**'
      - 'logicapps/**'
      - 'scripts/deploy_logic_app.sh'
      - 'scripts/test_logic_app.py'
      - 'scripts/deploy_infrastructure.sh'
      - 'tests/test_logic_app_consumption.py'
      - 'tests/test_deployment_identity.py'
      - 'tests/test_infrastructure_deployment.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'infra/**'
      - 'logicapps/**'
      - 'scripts/deploy_logic_app.sh'
      - 'scripts/test_logic_app.py'
      - 'scripts/deploy_infrastructure.sh'
      - 'tests/test_logic_app_consumption.py'
      - 'tests/test_deployment_identity.py'
      - 'tests/test_infrastructure_deployment.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Bicep
        run: az bicep install --version v0.44.1
      - name: Validate infrastructure and deployment guardrails
        run: |
          bash -n scripts/deploy_logic_app.sh
          bash scripts/deploy_logic_app.sh check
          bash -n scripts/deploy_infrastructure.sh
          bash scripts/deploy_infrastructure.sh check
          python -m unittest discover -s tests -p test_logic_app_consumption.py -v
          python -m unittest discover -s tests -p test_deployment_identity.py -v
          python -m unittest discover -s tests -p test_infrastructure_deployment.py -v
